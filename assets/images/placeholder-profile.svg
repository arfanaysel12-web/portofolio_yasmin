<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="55%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <clipPath id="round">
      <path d="M0 0h400v400H0z"/>
    </clipPath>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <circle cx="340" cy="60" r="80" fill="#ffffff" opacity="0.35"/>
  <circle cx="60" cy="360" r="100" fill="#ffffff" opacity="0.3"/>
  <circle cx="330" cy="330" r="50" fill="#ffffff" opacity="0.25"/>

  <!-- Decorative sparkles -->
  <path d="M92 96l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="#a78bfa" opacity="0.55"/>
  <path d="M308 150l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#f472b6" opacity="0.5"/>

  <!-- Female avatar illustration -->
  <g clip-path="url(#round)">
    <!-- Shoulders / body -->
    <path d="M128 400c4-70 30-108 72-108s68 38 72 108z" fill="url(#g1)" opacity="0.85"/>

    <!-- Neck -->
    <rect x="180" y="212" width="40" height="44" rx="16" fill="#f8cdc8"/>

    <!-- Head -->
    <ellipse cx="200" cy="180" rx="82" ry="86" fill="#ffe3dd"/>

    <!-- Hair -->
    <path d="M200 92c-48 0-80 38-80 86 0 26 10 46 28 60l10-24h84l10 24c18-14 28-34 28-60 0-48-32-86-80-86z" fill="#5b3a29"/>
    <path d="M130 112c10-22 40-38 76-34-6-6-16-10-26-10-38 0-66 30-66 62 0 12 4 22 10 32-2-6-4-12-4-18 0-6 4-18 10-32z" fill="#4a2e1f"/>

    <!-- Bangs -->
    <path d="M120 176c2-42 34-74 80-74s78 32 80 74c-4-30-30-52-80-52s-76 22-80 52z" fill="#5b3a29"/>

    <!-- Face -->
    <circle cx="172" cy="196" r="7" fill="#775745"/>
    <circle cx="228" cy="196" r="7" fill="#775745"/>
    <circle cx="172" cy="196" r="3" fill="#ffffff"/>
    <circle cx="228" cy="196" r="3" fill="#ffffff"/>

    <!-- Blush -->
    <circle cx="154" cy="212" r="12" fill="#ffb3c1" opacity="0.55"/>
    <circle cx="246" cy="212" r="12" fill="#ffb3c1" opacity="0.55"/>

    <!-- Smile -->
    <path d="M180 224q20 16 40 0" fill="none" stroke="#c96a63" stroke-width="5" stroke-linecap="round"/>

    <!-- Earrings -->
    <circle cx="132" cy="200" r="6" fill="#ec4899"/>
    <circle cx="268" cy="200" r="6" fill="#ec4899"/>

    <!-- Scrunchie -->
    <ellipse cx="200" cy="88" rx="20" ry="7" fill="#ec4899"/>
  </g>
</svg>